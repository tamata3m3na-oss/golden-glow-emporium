<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أدخل رقم الجوال</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Tajawal', sans-serif;
        background-color: #fff;
        color: #000;
        direction: rtl;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid #eee;
    }

    /* الجانب الأيسر */
    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .close {
        font-size: 22px;
        color: #444;
        cursor: pointer;
    }

    .lang {
        font-size: 14px;
        color: #555;
    }

    /* الجانب الأيمن */
    .logo {
        font-weight: 700;
        font-size: 24px;
    }

    .container {
        max-width: 400px;
        margin: 40px auto;
        padding: 20px;
    }

    h2 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        text-align: right;
    }

    .description {
        font-size: 14px;
        color: #666;
        margin-bottom: 28px;
        text-align: right;
    }

    .form-group {
        text-align: right;
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 14px;
        margin-bottom: 8px;
        color: #333;
    }

    .phone-input-group {
        display: flex;
        align-items: center;
        border: 1px solid #dcdcdc;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
        flex-direction: row-reverse;
    }

    .country-code {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #f7f7f7;
        border-right: 1px solid #ddd;
        padding: 12px 10px;
        font-size: 16px;
    }

    .country-code img {
        width: 22px;
        height: 15px;
        border-radius: 3px;
    }

    .phone-input {
        border: none;
        flex: 1;
        padding: 12px 10px;
        font-size: 16px;
        outline: none;
        direction: ltr;
    }

    .error-message {
        color: #c00;
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
    }

    .send-btn {
        width: 100%;
        border: none;
        border-radius: 30px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        background-color: #000;
        color: #fff;
        cursor: pointer;
        transition: background 0.3s;
    }

    .send-btn:disabled {
        background-color: #ddd;
        color: #999;
        cursor: not-allowed;
    }

</style>
</head>
<body>

<div class="header">
<div class="brand">

</div>    <div class="header-left">
        <span class="lang">English</span>
        <span class="close">&times;</span>
    </div>
</div>

<div class="container">
    <h2>أدخل رقم الجوال</h2>
    <p class="description">سيتم إرسال رمز تحقق للمتابعة</p>

    <form method="POST">
        <div class="form-group">
            <label for="phone">رقم الجوال</label>
            <div class="phone-input-group">
                <!-- ✅ التعديل: شيلنا pattern/maxlength والتقييد -->
                <input type="tel" id="phone" name="phone" class="phone-input" placeholder="اكتب رقمك"
                       inputmode="numeric" required>
                <span class="country-code">
                    +966
                    <img src="https://flagcdn.com/w20/sa.png" alt="SA Flag">
                </span>
            </div>
        </div>

        
        <button type="submit" id="sendBtn" class="send-btn" disabled>أرسل الرمز</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const phoneInput = document.getElementById('phone');
    const sendBtn = document.getElementById('sendBtn');

    phoneInput.addEventListener('input', function(e) {
        // ✅ التعديل: مفتوح غير محدود — بس بنخليها أرقام فقط
        let val = e.target.value.replace(/\D/g, '');
        e.target.value = val;

        // ✅ التعديل: تفعيل الزر طالما فيه رقم واحد على الأقل
        sendBtn.disabled = (val.length < 1);
    });
});
</script>

</body>
</html>
